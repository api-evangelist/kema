aid: kema
name: Kema
description: >-
  Kema (Kema FZ-LLC) is a UAE-based B2B fintech providing cash-flow and
  accounts-receivable tools for SMEs across the MENA region. Its platform
  combines invoice financing that advances up to 95% of invoice value,
  accounts-receivable automation with automated reminders, invoice tracking
  and reconciliation, and branded payment links delivered over email, WhatsApp
  and SMS that accept cards and wire transfers. Additional capabilities include
  practice-management tooling for accounting firms, recurring-payment
  automation, credit assessment and a real-time AR dashboard and analytics.
  Kema is backed by Speedinvest and reports 4,000+ companies transacting on its
  network.
